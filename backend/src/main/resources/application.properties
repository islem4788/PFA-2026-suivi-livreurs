# ═══════════════════════════════════════════════════════════════
# OINSExpress Backend Configuration
# ═══════════════════════════════════════════════════════════════

# Charge les secrets locaux si le fichier existe (non commité, voir .gitignore)
spring.config.import=optional:classpath:application-local.properties

spring.application.name=oinsexpress-backend
server.port=${PORT:10000}

# ═══ Database (PostgreSQL en prod, H2 en dev) ═══
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/oinsexpress}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ═══ JWT ═══
oinsexpress.jwt.secret=${JWT_SECRET:VotreCleSecreteSuperLongueDeMinimum256BitsPourSecuriserLesTokensOINSExpressPFA2026}
oinsexpress.jwt.expiration=${JWT_EXPIRATION:86400000}
oinsexpress.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ═══ Email (Brevo HTTP API — remplace SMTP bloqué sur Render) ═══
oinsexpress.mail.from=merghnichrifa@gmail.com
oinsexpress.brevo.api-key=${BREVO_API_KEY:}


# ═══ CORS ═══
oinsexpress.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:8100,http://127.0.0.1:8100,http://192.168.*:4200,http://10.*.*.*:4200}

# ═══ ML Service ═══
oinsexpress.ml.api-url=${ML_API_URL:https://oinsexpress-ia.onrender.com}
oinsexpress.ml.stationary-timeout-minutes=10

# ═══ Logging ═══
logging.level.com.oinsexpress=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# ═══ Actuator ═══
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
